<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f7f4">
  <title>GachaLog 管理画面</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:900px;margin:0 auto;padding:32px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
    h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 14px}.muted{color:#777;font-size:14px}
    .panel,.item{background:white;border:1px solid #e7e7e2;border-radius:16px;padding:20px;margin-bottom:16px}
    label{display:block;font-size:13px;color:#555;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
    button{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer}
    .primary{background:#252525;color:white}.secondary{background:#eee;color:#333}.danger{background:#fff0ee;color:#a33325}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.item h3{font-size:17px;margin:0 0 8px}.meta{font-size:13px;color:#666;line-height:1.8;overflow-wrap:anywhere}
    .desc{font-size:14px;line-height:1.7;margin:12px 0}.notice{padding:12px;border-radius:10px;background:#f1f3ef;font-size:14px;line-height:1.6}
    #message{margin:12px 0;color:#9b352b;font-size:14px;white-space:pre-wrap}.hidden{display:none!important}
    @media(min-width:650px){.item{display:flex;justify-content:space-between;gap:20px}.item-main{flex:1}.item-actions{min-width:150px;align-self:center}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><h1>GachaLog 管理画面</h1><p class="muted">商品候補の確認・公開管理</p></div><a href="./" class="muted">アプリへ戻る</a></div>
  <section id="loginPanel" class="panel">
    <h2>管理者ログイン</h2>
    <p class="muted">Supabase Authに登録した管理者アカウントでログインしてください。</p>
    <form id="loginForm">
      <label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="primary" type="submit">ログイン</button></div>
    </form>
  </section>
  <section id="dashboard" class="hidden">
    <div class="panel"><div class="top" style="margin:0"><div><h2 style="margin:0">確認待ちの商品</h2><p class="muted" style="margin:6px 0 0">公開するとGachaLogアプリに表示されます。</p></div><button id="logout" class="secondary">ログアウト</button></div></div>
    <div id="message" role="status"></div>
    <div id="pendingList"></div>
  </section>
  <p id="loginMessage" class="muted"></p>
  <div class="notice">このページはログイン画面だけでは保護されません。商品データの閲覧・変更はSupabaseのRow Level Security（RLS）ポリシーでも制限します。管理者用SQLの設定が必要です。</div>
</main>
<script src="./admin.js"></script>
</body>
</html>
